name: Build Windows test artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows distribution (${{ matrix.name }})
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            arch: x64
            go_arch: amd64
          - name: arm64
            arch: arm64
            go_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        run: |
          $corepackBin = Join-Path $env:RUNNER_TEMP "corepack-bin"
          New-Item -ItemType Directory -Force $corepackBin | Out-Null
          corepack enable --install-directory $corepackBin
          corepack install --global yarn@4.18.0
          $corepackBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$corepackBin;$env:PATH"
          yarn --version

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            packages/engine/go.sum

      - name: Install dependencies
        shell: pwsh
        run: yarn install --immutable

      - name: Build and verify Windows distribution
        shell: pwsh
        run: .\scripts\build-windows.ps1 -ElectronArch "${{ matrix.arch }}" -GoArch "${{ matrix.go_arch }}"

      - name: Upload Windows test artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwn-simulator-windows-test-${{ matrix.name }}-${{ github.sha }}
          path: |
            releases/desktop/build/*.exe
            apps/desktop/assets/lwn-server.exe
            releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
