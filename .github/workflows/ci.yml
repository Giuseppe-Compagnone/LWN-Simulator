name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            packages/engine/go.sum

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install documentation dependencies
        working-directory: docs
        run: yarn install --immutable

      - name: Generate contracts
        run: yarn generate

      - name: Type-check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build frontend assets
        run: yarn workspace @lwn-simulator/frontend build

      - name: Install Playwright browsers
        run: yarn workspace @lwn-simulator/frontend exec playwright install --with-deps chromium firefox webkit

      - name: Test frontend unit suite
        run: yarn test:frontend:coverage

      - name: Test frontend user journeys
        run: yarn test:e2e
        env:
          PLAYWRIGHT_REUSE_EXPORT: true
          PLAYWRIGHT_CROSS_BROWSER: true

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: apps/frontend/coverage
          if-no-files-found: error
          retention-days: 7

      - name: Test backend
        run: yarn test

      - name: Vet backend
        working-directory: apps/backend
        run: go vet ./...

      - name: Vet engine
        working-directory: packages/engine
        run: go vet ./...
