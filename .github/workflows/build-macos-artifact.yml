name: Build macOS test artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS distribution (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            arch: x64
            go_arch: amd64
            expected_backend_arch: x86_64
            expected_runner_arch: x86_64
            runner: macos-15-intel
          - name: arm64
            arch: arm64
            go_arch: arm64
            expected_backend_arch: arm64
            expected_runner_arch: arm64
            runner: macos-15

    env:
      LWN_TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Enable Corepack
        run: |
          corepack enable
          corepack install --global yarn@4.18.0
          yarn --version

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            packages/engine/go.sum

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.expected_runner_arch }}"

      - name: Build macOS distribution
        run: ./scripts/build-all.sh

      - name: Verify macOS artifacts
        run: |
          artifacts=(releases/desktop/*.dmg releases/desktop/*.zip)
          test "${#artifacts[@]}" -eq 2
          test -x releases/server/lwn-server
          file releases/server/lwn-server | grep -F "${{ matrix.expected_backend_arch }}"
          releases/server/lwn-server --help >/dev/null
          shasum -a 256 "${artifacts[@]}" releases/server/lwn-server > releases/SHA256SUMS

      - name: Upload macOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwn-simulator-macos-test-${{ matrix.name }}-${{ github.sha }}
          path: |
            releases/desktop/*.dmg
            releases/desktop/*.zip
            releases/server/lwn-server
            releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
