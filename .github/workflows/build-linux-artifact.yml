name: Build Linux test artifact

on:
  workflow_dispatch:
  push:
    branches:
      - distribution

permissions:
  contents: read

concurrency:
  group: linux-test-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux distribution (${{ matrix.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            arch: x64
          - name: arm64
            arch: arm64
          - name: armv7l
            arch: armv7l

    env:
      LWN_TARGET_ARCH: ${{ matrix.arch }}
      LWN_ELECTRON_TARGETS: AppImage,deb,rpm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true
          cache-dependency-path: |
            apps/backend/go.sum
            packages/engine/go.sum

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm

      - name: Install QEMU user emulation
        if: matrix.arch != 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-user-static

      - name: Build Linux distribution
        run: ./scripts/build-all.sh

      - name: Verify Linux artifacts
        run: |
          appimages=(releases/desktop/LWN-Simulator-*.AppImage)
          debs=(releases/desktop/*.deb)
          rpms=(releases/desktop/*.rpm)
          test "${#appimages[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          test "${#rpms[@]}" -eq 1
          test -x releases/server/lwn-server
          test -s "${appimages[0]}"
          test -s "${debs[0]}"
          test -s "${rpms[0]}"

          case "$LWN_TARGET_ARCH" in
            x64) expected_backend_arch='x86-64' ;;
            arm64) expected_backend_arch='ARM aarch64' ;;
            armv7l) expected_backend_arch='ARM, EABI5' ;;
            *) echo "Unsupported verification architecture: $LWN_TARGET_ARCH" >&2; exit 1 ;;
          esac

          file releases/server/lwn-server | grep -F "$expected_backend_arch"
          sha256sum \
            releases/server/lwn-server \
            "${appimages[0]}" \
            "${debs[0]}" \
            "${rpms[0]}" \
            > releases/SHA256SUMS

      - name: Smoke test x86_64 binaries
        if: matrix.arch == 'x64'
        run: |
          appimages=(releases/desktop/LWN-Simulator-*.AppImage)
          releases/server/lwn-server --help >/dev/null
          "${appimages[0]}" --appimage-version >/dev/null

      - name: Smoke test ARM backend with QEMU
        if: matrix.arch == 'arm64' || matrix.arch == 'armv7l'
        run: |
          if [ "$LWN_TARGET_ARCH" = "arm64" ]; then
            qemu-aarch64-static releases/server/lwn-server --help >/dev/null
          else
            qemu-arm-static releases/server/lwn-server --help >/dev/null
          fi

      - name: Upload Linux test artifact
        uses: actions/upload-artifact@v4
        with:
          name: lwn-simulator-linux-test-${{ matrix.name }}-${{ github.sha }}
          path: |
            releases/server/lwn-server
            releases/desktop/*.AppImage
            releases/desktop/*.deb
            releases/desktop/*.rpm
            releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
