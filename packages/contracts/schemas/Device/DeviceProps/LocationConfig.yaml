title: LocationConfig
type: object

properties:
  latitude:
    type: number
    x-oapi-codegen-extra-tags:
      validate: "required,min=-90,max=90"
  longitude:
    type: number
    x-oapi-codegen-extra-tags:
      validate: "required,min=-180,max=180"
  altitude:
    type: number
  region:
    $ref: "./DeviceRegion.yaml"

required:
  - latitude
  - longitude
  - altitude
  - region
