title: RX2Config
type: object

properties:
  delay:
    type: integer
    minimum: 1
    description: Delay before the RX2 receive window opens, in milliseconds.
    x-go-type: "*int"
    x-oapi-codegen-extra-tags:
      validate: "required,gt=0"
  duration:
    type: integer
    minimum: 1
    description: Duration of the RX2 receive window, in milliseconds.
    x-go-type: "*int"
    x-oapi-codegen-extra-tags:
      validate: "required,gt=0"
  channelFrequency:
    type: integer
    format: int64
    minimum: 1
    description: RX2 channel center frequency, in hertz.
    x-oapi-codegen-extra-tags:
      validate: "required,gt=0"
  dataRate:
    type: integer
    minimum: 0
    maximum: 15
    description: Regional data-rate index used by RX2.
    x-go-type: "*int"
    x-oapi-codegen-extra-tags:
      validate: "required,min=0,max=15"
  ACKTimeout:
    type: integer
    minimum: 1000
    maximum: 3000
    description: Time to wait for an acknowledgement before retrying, in milliseconds.
    x-oapi-codegen-extra-tags:
      validate: "required,min=1000,max=3000"

required:
  - delay
  - duration
  - channelFrequency
  - dataRate
  - ACKTimeout
