title: RuntimeDevice
type: object

properties:
  id:
    type: string
    x-go-name: ID
    x-oapi-codegen-extra-tags:
      validate: "required,len=36"
  name:
    type: string
    x-oapi-codegen-extra-tags:
      validate: "required"
  active:
    type: boolean
  status:
    $ref: "./RuntimeStatus.yaml"
  joined:
    type: boolean
  frameCounterUp:
    type: integer
    format: int64
    x-go-name: FrameCounterUp
    x-oapi-codegen-extra-tags:
      validate: "min=0"
  frameCounterDown:
    type: integer
    format: int64
    x-go-name: FrameCounterDown
    x-oapi-codegen-extra-tags:
      validate: "min=0"
  pendingConfirmedUplink:
    type: boolean
    x-go-name: PendingConfirmedUplink
  lastRSSI:
    type: number
    format: double
    x-go-type: float64
    x-go-name: LastRSSI
  lastSNR:
    type: number
    format: double
    x-go-type: float64
    x-go-name: LastSNR
  lastAirtimeMilliseconds:
    type: integer
    format: int64
    x-go-name: LastAirtimeMilliseconds
    x-oapi-codegen-extra-tags:
      validate: "min=0"
  lastChannelFrequency:
    type: integer
    format: int64
    x-go-name: LastChannelFrequency
    x-oapi-codegen-extra-tags:
      validate: "min=0"

required:
  - id
  - name
  - active
  - status
  - joined
  - frameCounterUp
  - frameCounterDown
  - pendingConfirmedUplink
  - lastRSSI
  - lastSNR
  - lastAirtimeMilliseconds
  - lastChannelFrequency
