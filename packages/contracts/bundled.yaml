        - pausing
        - paused
        - resuming
        - stopping
        - stopped
        - recovering
        - failed
      x-enum-varnames:
        - Idle
        - Starting
        - Running
        - Pausing
        - Paused
        - Resuming
        - Stopping
        - Stopped
        - Recovering
        - Failed
    SimulationEventType:
      title: SimulationEventType
      type: string
