        - SimulationResumed
        - SimulationStopped
        - SimulationRecovered
        - SimulationFailed
        - DeviceRegistered
        - DeviceRemoved
        - GatewayRegistered
        - GatewayRemoved
        - SchedulerEventScheduled
        - SchedulerEventCancelled
        - DeviceUplinkScheduled
        - DeviceUplinkTransmitted
        - GatewayPacketReceived
        - PacketDropped
        - MetricsUpdated
        - DeviceJoinRequestScheduled
        - DeviceJoinRequestTransmitted
        - JoinRequestReceived
        - JoinAcceptReceived
        - RX1WindowOpened
        - RX2WindowOpened
        - UplinkACKReceived
