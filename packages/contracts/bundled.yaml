        - frame-counter-rejected
        - radio-transmission-started
        - radio-transmission-completed
        - radio-collision-detected
        - radio-packet-lost
        - gateway-connecting
        - gateway-connected
        - gateway-disconnected
        - gateway-reconnecting
        - gateway-heartbeat
        - gateway-packet-ingress
        - gateway-packet-egress
        - gateway-network-error
        - gateway-beacon-scheduled
        - gateway-beacon-transmitted
        - device-beacon-synchronized
        - device-beacon-missed
        - class-b-ping-slot-scheduled
        - class-b-ping-slot-opened
        - class-b-downlink-scheduled
        - class-b-downlink-transmitted
        - device-downlink-scheduled
        - device-downlink-transmitted
        - device-downlink-dropped
      x-enum-varnames:
