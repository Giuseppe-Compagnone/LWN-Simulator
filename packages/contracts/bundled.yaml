            uri: id
      required:
        - id
    GetDeviceResponse:
      title: GetDeviceResponse
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
      required:
        - device
    GetDevicesRequest:
      title: GetDevicesRequest
      type: object
      x-go-type: struct{}
      additionalProperties: false
      properties: {}
    GetDevicesResponse:
      title: GetDeviceResponse
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
      required:
        - devices
    UpdateDeviceRequest:
      title: UpdateDeviceRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
        device:
          $ref: '#/components/schemas/Device'
      required:
        - id
        - device
    UpdateDeviceResponse:
      title: UpdateDeviceResponse
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
      required:
        - device
    DeleteDeviceRequest:
      title: GetDeviceRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
      required:
        - id
    DeleteDeviceResponse:
      title: GetDevicesResponse
      type: object
      x-go-type: struct{}
      additionalProperties: false
      properties: {}
    Gateway:
      title: Gateway
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-oapi-codegen-extra-tags:
            validate: required,len=36
        active:
