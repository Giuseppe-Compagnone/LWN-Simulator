        gatewayIPv4:
          type: string
        gatewayPort:
          type: integer
          format: int32
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=65535
        latitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
