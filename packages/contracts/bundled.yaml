openapi: 3.0.3
info:
  title: LWN Simulator API
  version: 1.0.0
  description: API contract for LWN Simulator
paths: {}
components:
  schemas:
    RealtimeWebSocketMessageType:
      title: RealtimeWebSocketMessageType
      type: string
      enum:
        - device.created
        - device.updated
        - device.deleted
        - gateway.created
        - gateway.updated
        - gateway.deleted
        - simulation.snapshot
        - simulation.event
        - simulation.run.created
        - simulation.run.updated
        - error
      x-enum-varnames:
        - RealtimeDeviceCreatedMessage
        - RealtimeDeviceUpdatedMessage
        - RealtimeDeviceDeletedMessage
        - RealtimeGatewayCreatedMessage
        - RealtimeGatewayUpdatedMessage
        - RealtimeGatewayDeletedMessage
        - RealtimeSimulationSnapshotMessage
        - RealtimeSimulationEventMessage
        - RealtimeSimulationRunCreatedMessage
        - RealtimeSimulationRunUpdatedMessage
        - RealtimeErrorMessage
    RealtimeWebSocketMessage:
      title: RealtimeWebSocketMessage
      type: object
      properties:
        type:
          $ref: '#/components/schemas/RealtimeWebSocketMessageType'
        timestampMilliseconds:
          type: integer
          format: int64
          x-go-name: TimestampMilliseconds
          x-oapi-codegen-extra-tags:
            validate: min=0
        resourceID:
          type: string
          x-go-name: ResourceID
          x-oapi-codegen-extra-tags:
            validate: omitempty
        runID:
          type: string
          x-go-name: RunID
          x-oapi-codegen-extra-tags:
            validate: omitempty
        device:
          $ref: '#/components/schemas/Device'
        gateway:
          $ref: '#/components/schemas/Gateway'
        snapshot:
          $ref: '#/components/schemas/SimulationSnapshot'
        event:
          $ref: '#/components/schemas/SimulationEvent'
        runSummary:
          $ref: '#/components/schemas/SimulationRunSummary'
        error:
          type: string
          x-go-name: Error
          x-oapi-codegen-extra-tags:
            validate: omitempty
      required:
        - type
        - timestampMilliseconds
    AppInfoResponse:
      title: AppInfoResponse
      type: object
      properties:
        app:
          type: string
        version:
          type: string
      required:
        - app
        - version
    StatusResponse:
      title: StatusResponse
      type: object
      properties:
        port:
          type: string
      required:
        - port
    DeviceClass:
      title: DeviceClass
      type: string
      enum:
        - class-a
        - class-b
        - class-c
      x-enum-varnames:
        - ClassA
        - ClassB
        - ClassC
    DeviceActivation:
      title: DeviceClass
      type: string
      enum:
        - oota
        - abp
      x-enum-varnames:
        - OOTA
        - ABP
    OOTAConfig:
      title: OOTAConfig
      type: object
      properties:
        joinEUI:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=16
        appKey:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=32
      required:
        - joinEUI
        - appKey
    ABPConfig:
      title: ABPConfig
      type: object
      properties:
        devAddr:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=8
        nwkSKey:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=32
        appSKey:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=32
      required:
        - devAddr
        - nwkSKey
        - appSKey
    DeviceRegion:
      title: DeviceClass
      type: string
      enum:
        - EU868
        - US915
        - CN779
        - EU433
        - AU915
        - CN470
        - AS923
        - KR920
        - IN865
        - RU864
      x-enum-varnames:
        - EU868
        - US915
        - CN779
        - EU433
        - AU915
        - CN470
        - AS923
        - KR920
        - IN865
        - RU864
    LocationConfig:
      title: LocationConfig
      type: object
      properties:
        latitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required,min=-90,max=90
        longitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required,min=-180,max=180
        altitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required
        region:
          $ref: '#/components/schemas/DeviceRegion'
      required:
        - latitude
        - longitude
        - altitude
        - region
    FrameConfig:
      title: FrameConfig
      type: object
      properties:
        fPort:
          type: integer
          x-oapi-codegen-extra-tags:
            validate: required,min=1,max=223
        retransmission:
          type: integer
          x-go-type: '*int'
          x-oapi-codegen-extra-tags:
            validate: required,min=0
        FCntUp:
          type: integer
          x-go-type: '*int'
          x-oapi-codegen-extra-tags:
            validate: required,min=0
        FCntDown:
          type: integer
          x-go-type: '*int'
          x-oapi-codegen-extra-tags:
            validate: required,min=0
        disableFrameCounterValidation:
          type: boolean
      required:
        - fPort
        - retransmission
        - disableFrameCounterValidation
    OversizedPayloadBehavior:
      title: DeviceClass
      type: string
      enum:
        - fragment
        - truncate
      x-enum-varnames:
        - Fragment
        - Truncate
    DeviceMType:
      title: DeviceClass
      type: string
      enum:
        - confirmed-data-up
        - unconfirmed-data-up
      x-enum-varnames:
        - ConfirmedDataUp
        - UnconfirmedDataUp
    PayloadConfig:
      title: PayloadConfig
      type: object
      properties:
        uplinkInterval:
          type: number
          x-oapi-codegen-extra-tags:
            validate: required,gt=0
        oversizedPayloadBehavior:
          $ref: '#/components/schemas/OversizedPayloadBehavior'
        MType:
          $ref: '#/components/schemas/DeviceMType'
        payload:
          type: string
        base64Encoded:
          type: boolean
      required:
        - uplinkInterval
        - oversizedPayloadBehavior
        - MType
        - payload
        - base64Encoded
    AdvancedConfig:
      title: AdvancedConfig
      type: object
      properties:
        antennaRange:
          type: number
          x-oapi-codegen-extra-tags:
            validate: required,gt=0
        ADREnabled:
          type: boolean
        uplinkDataRate:
          type: integer
          description: Initial uplink data rate. The valid range depends on the selected region (up to DR6 for AU915); when omitted, the engine uses the regional default.
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=0,max=6
      required:
        - antennaRange
        - ADREnabled
    Device:
      title: Device
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-oapi-codegen-extra-tags:
            validate: required,len=36
        active:
          type: boolean
        name:
          type: string
        devEUI:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=16
        class:
          $ref: '#/components/schemas/DeviceClass'
        RX1Config:
          $ref: '#/components/schemas/RX1Config'
        RX2Config:
          $ref: '#/components/schemas/RX2Config'
        activation:
          $ref: '#/components/schemas/DeviceActivation'
        OOTAConfig:
          $ref: '#/components/schemas/OOTAConfig'
        ABPConfig:
          $ref: '#/components/schemas/ABPConfig'
        locationConfig:
          $ref: '#/components/schemas/LocationConfig'
        frameConfig:
          $ref: '#/components/schemas/FrameConfig'
        payloadConfig:
          $ref: '#/components/schemas/PayloadConfig'
        advancedConfig:
          $ref: '#/components/schemas/AdvancedConfig'
      required:
        - id
        - active
        - name
        - devEUI
        - class
        - RX1Config
        - RX2Config
        - activation
        - locationConfig
        - frameConfig
        - payloadConfig
        - advancedConfig
    CreateDeviceRequest:
      title: CreateDeviceRequest
      type: object
      properties:
        devEUI:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=16
        name:
          type: string
        activation:
          $ref: '#/components/schemas/DeviceActivation'
        class:
          $ref: '#/components/schemas/DeviceClass'
        locationConfig:
          $ref: '#/components/schemas/LocationConfig'
        ABPConfig:
          $ref: '#/components/schemas/ABPConfig'
        OOTAConfig:
          $ref: '#/components/schemas/OOTAConfig'
        RX1Config:
          $ref: '#/components/schemas/RX1Config'
        RX2Config:
          $ref: '#/components/schemas/RX2Config'
        advancedConfig:
          $ref: '#/components/schemas/AdvancedConfig'
        frameConfig:
          $ref: '#/components/schemas/FrameConfig'
        payloadConfig:
          $ref: '#/components/schemas/PayloadConfig'
      required:
        - devEUI
        - name
        - activation
        - class
        - locationConfig
        - RX1Config
        - RX2Config
        - advancedConfig
        - frameConfig
        - payloadConfig
    CreateDeviceResponse:
      title: CreateDeviceResponse
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
      required:
        - device
    GetDeviceRequest:
      title: GetDeviceRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
      required:
        - id
    GetDeviceResponse:
      title: GetDeviceResponse
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
      required:
        - device
    GetDevicesRequest:
      title: GetDevicesRequest
      type: object
      x-go-type: struct{}
      additionalProperties: false
      properties: {}
    GetDevicesResponse:
      title: GetDeviceResponse
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
      required:
        - devices
    UpdateDeviceRequest:
      title: UpdateDeviceRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
        device:
          $ref: '#/components/schemas/Device'
      required:
        - id
        - device
    UpdateDeviceResponse:
      title: UpdateDeviceResponse
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
      required:
        - device
    DeleteDeviceRequest:
      title: GetDeviceRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
      required:
        - id
    DeleteDeviceResponse:
      title: GetDevicesResponse
      type: object
      x-go-type: struct{}
      additionalProperties: false
      properties: {}
    Gateway:
      title: Gateway
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-oapi-codegen-extra-tags:
            validate: required,len=36
        active:
          type: boolean
        name:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
        type:
          $ref: '#/components/schemas/GatewayType'
        macAddress:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
        gatewayEUI:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=16
        keepAlive:
          type: integer
          format: int32
          x-oapi-codegen-extra-tags:
            validate: omitempty,gt=0
        gatewayIPv4:
          type: string
        gatewayPort:
          type: integer
          format: int32
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=65535
        latitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required,min=-90,max=90
        longitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required,min=-180,max=180
        altitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required
      required:
        - id
        - active
        - name
        - type
        - macAddress
        - gatewayEUI
        - latitude
        - longitude
        - altitude
    GatewayType:
      title: GatewayType
      type: string
      enum:
        - virtual
        - real
      x-enum-varnames:
        - Virtual
        - Real
    CreateGatewayRequest:
      title: CreateGatewayRequest
      type: object
      properties:
        name:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
        type:
          $ref: '#/components/schemas/GatewayType'
        macAddress:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required
        gatewayEUI:
          type: string
          x-oapi-codegen-extra-tags:
            validate: required,len=16
        keepAlive:
          type: integer
          format: int32
          x-oapi-codegen-extra-tags:
            validate: omitempty,gt=0
        gatewayIPv4:
          type: string
        gatewayPort:
          type: integer
          format: int32
          x-oapi-codegen-extra-tags:
            validate: omitempty,min=1,max=65535
        latitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required,min=-90,max=90
        longitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required,min=-180,max=180
        altitude:
          type: number
          x-go-type: '*float32'
          x-oapi-codegen-extra-tags:
            validate: required
      required:
        - name
        - type
        - macAddress
        - gatewayEUI
        - latitude
        - longitude
        - altitude
    CreateGatewayResponse:
      title: CreateGatewayResponse
      type: object
      properties:
        gateway:
          $ref: '#/components/schemas/Gateway'
      required:
        - gateway
    GetGatewayRequest:
      title: GetGatewayRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
      required:
        - id
    GetGatewayResponse:
      title: GetGatewayResponse
      type: object
      properties:
        gateway:
          $ref: '#/components/schemas/Gateway'
      required:
        - gateway
    GetGatewaysRequest:
      title: GetGatewaysRequest
      type: object
      x-go-type: struct{}
      additionalProperties: false
      properties: {}
    GetGatewaysResponse:
      title: GetGatewaysResponse
      type: object
      properties:
        gateways:
          type: array
          items:
            $ref: '#/components/schemas/Gateway'
      required:
        - gateways
    UpdateGatewayRequest:
      title: UpdateGatewayRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
        gateway:
          $ref: '#/components/schemas/Gateway'
      required:
        - id
        - gateway
    UpdateGatewayResponse:
      title: UpdateGatewayResponse
      type: object
      properties:
        gateway:
          $ref: '#/components/schemas/Gateway'
      required:
        - gateway
    DeleteGatewayRequest:
      title: DeleteGatewayRequest
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
          x-go-json-ignore: true
          x-oapi-codegen-extra-tags:
            validate: required,len=36
            uri: id
      required:
        - id
    DeleteGatewayResponse:
      title: DeleteGatewayResponse
      type: object
      x-go-type: struct{}
      additionalProperties: false
      properties: {}
    SimulationConfig:
      title: SimulationConfig
      type: object
      properties:
        speed:
          type: number
          x-go-type: float64
          x-oapi-codegen-extra-tags:
            validate: required,gt=0
        seed:
          type: integer
          format: int64
          x-oapi-codegen-extra-tags:
            validate: omitempty
        gatewayBridge:
          $ref: '#/components/schemas/GatewayBridgeConfig'
      required:
        - speed
    GatewayBridgeConfig:
      title: GatewayBridgeConfig
      type: object
      properties:
        enabled:
          type: boolean
        address:
          type: string
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          x-oapi-codegen-extra-tags:
            validate: gt=0,lte=65535
      required:
        - enabled
        - address
        - port
    SimulationSpeedRequest:
      title: SimulationSpeedRequest
      type: object
      properties:
        speed:
          type: number
          x-go-type: float64
          x-oapi-codegen-extra-tags:
            validate: required,gt=0
      required:
        - speed
    SimulationStatus:
      title: SimulationStatus
      type: string
      enum:
        - idle
