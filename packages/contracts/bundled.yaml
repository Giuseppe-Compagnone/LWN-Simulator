openapi: 3.0.3
info:
  title: LWN Simulator API
  version: 1.0.0
  description: API contract for LWN Simulator
paths: {}
components:
  schemas:
    AppInfoResponse:
      title: AppInfoResponse
      type: object
      properties:
        app:
          type: string
        version:
          type: string
      required:
        - app
        - version
    StatusResponse:
      title: StatusResponse
      type: object
      properties:
        port:
          type: string
      required:
        - port
    Device:
      title: Device
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
        devEUI:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - id
        - devEUI
        - latitude
        - longitude
    CreateDeviceRequest:
      title: CreateDeviceRequest
      type: object
      properties:
        devEUI:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - devEUI
        - latitude
        - longitude
    CreateDeviceResponse:
      title: CreateDeviceResponse
      type: object
      properties:
        device:
          $ref: '#/components/schemas/Device'
      required:
        - device
    Gateway:
      title: Gateway
      type: object
      properties:
        id:
          type: string
          x-go-name: ID
        gatewayEUI:
          type: string
        latitude:
          type: number
        longitude:
          type: number
      required:
        - id
        - gatewayEUI
        - latitude
        - longitude
